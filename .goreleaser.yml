version: 2

builds:
  - id: petri-pilot
    main: ./cmd/petri-pilot
    binary: petri-pilot
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/pflow-xyz/petri-pilot/internal/version.Version={{.Version}}

archives:
  - id: default
    formats: [ 'tar.gz' ]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

dockers_v2:
  - images:
      - "ghcr.io/pflow-xyz/petri-pilot"
    dockerfile: Dockerfile.goreleaser
    tags:
      - "v{{ .Version }}"
      - latest
