version: 2

builds:
  - id: petri-pilot
    main: ./cmd/petri-pilot
    binary: petri-pilot
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/pflow-xyz/petri-pilot/internal/version.Version={{.Version}}

archives:
  - id: default
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

dockers:
  - image_templates:
      - "ghcr.io/pflow-xyz/petri-pilot:{{ .Version }}-amd64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
    goarch: amd64
  - image_templates:
      - "ghcr.io/pflow-xyz/petri-pilot:{{ .Version }}-arm64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
    goarch: arm64

docker_manifests:
  - name_template: "ghcr.io/pflow-xyz/petri-pilot:{{ .Version }}"
    image_templates:
      - "ghcr.io/pflow-xyz/petri-pilot:{{ .Version }}-amd64"
      - "ghcr.io/pflow-xyz/petri-pilot:{{ .Version }}-arm64"
  - name_template: "ghcr.io/pflow-xyz/petri-pilot:latest"
    image_templates:
      - "ghcr.io/pflow-xyz/petri-pilot:{{ .Version }}-amd64"
      - "ghcr.io/pflow-xyz/petri-pilot:{{ .Version }}-arm64"
