<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .title { font-size: 16px; font-weight: 700; fill: #222; text-anchor: middle; }
    .subtitle { font-size: 11px; fill: #666; text-anchor: middle; }
    .team { font-size: 10px; fill: #333; text-anchor: middle; }
    .pct { font-size: 9px; fill: #555; text-anchor: middle; }
    .legend-text { font-size: 11px; fill: #333; }
    .axis { stroke: #ccc; stroke-width: 1; }
    .grid { stroke: #eee; stroke-width: 0.5; }
    .tick { font-size: 9px; fill: #999; text-anchor: end; }
  </style>

  <text x="450" y="24" class="title">Championship Probability: Three Methods Converge</text>
  <text x="450" y="42" class="subtitle">Analytical (from C) vs ODE (t=500) vs Monte Carlo (10k sims)</text>

  <!-- Legend -->
  <g transform="translate(270, 54)">
    <rect x="0" y="0" width="14" height="10" rx="2" fill="#1a5276"/>
    <text x="20" y="9" class="legend-text">Analytical (C + rates)</text>
    <rect x="170" y="0" width="14" height="10" rx="2" fill="#2e86c1"/>
    <text x="190" y="9" class="legend-text">ODE (Model 6)</text>
    <rect x="310" y="0" width="14" height="10" rx="2" fill="#85c1e9" stroke="#5dade2" stroke-width="0.5"/>
    <text x="330" y="9" class="legend-text">MC (10k sims)</text>
  </g>

  <g transform="translate(80, 80)">
    <!-- Axis -->
    <line x1="0" y1="0" x2="0" y2="310" class="axis"/>
    <line x1="0" y1="310" x2="780" y2="310" class="axis"/>

    <!-- Grid lines and tick labels -->
    <line x1="0" y1="0" x2="780" y2="0" class="grid"/>
    <text x="-8" y="5" class="tick">30%</text>
    <line x1="0" y1="52" x2="780" y2="52" class="grid"/>
    <text x="-8" y="56" class="tick">25%</text>
    <line x1="0" y1="103" x2="780" y2="103" class="grid"/>
    <text x="-8" y="108" class="tick">20%</text>
    <line x1="0" y1="155" x2="780" y2="155" class="grid"/>
    <text x="-8" y="160" class="tick">15%</text>
    <line x1="0" y1="207" x2="780" y2="207" class="grid"/>
    <text x="-8" y="211" class="tick">10%</text>
    <line x1="0" y1="258" x2="780" y2="258" class="grid"/>
    <text x="-8" y="263" class="tick">5%</text>

    <!-- Duke: 28.76, 28.32, 29.4 — bar group width=56, spacing=86 -->
    <g transform="translate(18, 0)">
      <rect x="0"  y="13"  width="16" height="297" rx="2" fill="#1a5276"/>
      <rect x="19" y="18"  width="16" height="292" rx="2" fill="#2e86c1"/>
      <rect x="38" y="6"   width="16" height="304" rx="2" fill="#85c1e9" stroke="#5dade2" stroke-width="0.5"/>
      <text x="27" y="328" class="team">Duke</text>
      <text x="27" y="340" class="pct">28.8%</text>
    </g>

    <!-- Arizona: 18.13, 17.86, 17.9 -->
    <g transform="translate(104, 0)">
      <rect x="0"  y="123" width="16" height="187" rx="2" fill="#1a5276"/>
      <rect x="19" y="126" width="16" height="184" rx="2" fill="#2e86c1"/>
      <rect x="38" y="125" width="16" height="185" rx="2" fill="#85c1e9" stroke="#5dade2" stroke-width="0.5"/>
      <text x="27" y="328" class="team">Arizona</text>
      <text x="27" y="340" class="pct">18.1%</text>
    </g>

    <!-- Michigan: 11.21, 11.04, 11.1 -->
    <g transform="translate(190, 0)">
      <rect x="0"  y="194" width="16" height="116" rx="2" fill="#1a5276"/>
      <rect x="19" y="196" width="16" height="114" rx="2" fill="#2e86c1"/>
      <rect x="38" y="195" width="16" height="115" rx="2" fill="#85c1e9" stroke="#5dade2" stroke-width="0.5"/>
      <text x="27" y="328" class="team">Michigan</text>
      <text x="27" y="340" class="pct">11.2%</text>
    </g>

    <!-- Houston: 10.25, 10.09, 9.8 -->
    <g transform="translate(276, 0)">
      <rect x="0"  y="204" width="16" height="106" rx="2" fill="#1a5276"/>
      <rect x="19" y="206" width="16" height="104" rx="2" fill="#2e86c1"/>
      <rect x="38" y="209" width="16" height="101" rx="2" fill="#85c1e9" stroke="#5dade2" stroke-width="0.5"/>
      <text x="27" y="328" class="team">Houston</text>
      <text x="27" y="340" class="pct">10.3%</text>
    </g>

    <!-- Florida: 8.86, 8.73, 8.9 -->
    <g transform="translate(362, 0)">
      <rect x="0"  y="219" width="16" height="91" rx="2" fill="#1a5276"/>
      <rect x="19" y="220" width="16" height="90" rx="2" fill="#2e86c1"/>
      <rect x="38" y="218" width="16" height="92" rx="2" fill="#85c1e9" stroke="#5dade2" stroke-width="0.5"/>
      <text x="27" y="328" class="team">Florida</text>
      <text x="27" y="340" class="pct">8.9%</text>
    </g>

    <!-- Purdue: 5.39, 5.31, 5.3 -->
    <g transform="translate(448, 0)">
      <rect x="0"  y="254" width="16" height="56" rx="2" fill="#1a5276"/>
      <rect x="19" y="255" width="16" height="55" rx="2" fill="#2e86c1"/>
      <rect x="38" y="255" width="16" height="55" rx="2" fill="#85c1e9" stroke="#5dade2" stroke-width="0.5"/>
      <text x="27" y="328" class="team">Purdue</text>
      <text x="27" y="340" class="pct">5.4%</text>
    </g>

    <!-- Iowa St: 3.56, 3.50, 3.5 -->
    <g transform="translate(534, 0)">
      <rect x="0"  y="273" width="16" height="37" rx="2" fill="#1a5276"/>
      <rect x="19" y="274" width="16" height="36" rx="2" fill="#2e86c1"/>
      <rect x="38" y="274" width="16" height="36" rx="2" fill="#85c1e9" stroke="#5dade2" stroke-width="0.5"/>
      <text x="27" y="328" class="team">Iowa St</text>
      <text x="27" y="340" class="pct">3.5%</text>
    </g>

    <!-- UConn: 3.33, 3.28, 3.3 -->
    <g transform="translate(620, 0)">
      <rect x="0"  y="276" width="16" height="34" rx="2" fill="#1a5276"/>
      <rect x="19" y="276" width="16" height="34" rx="2" fill="#2e86c1"/>
      <rect x="38" y="276" width="16" height="34" rx="2" fill="#85c1e9" stroke="#5dade2" stroke-width="0.5"/>
      <text x="27" y="328" class="team">UConn</text>
      <text x="27" y="340" class="pct">3.3%</text>
    </g>

    <!-- Others: remaining 8 teams -->
    <g transform="translate(706, 0)">
      <rect x="0"  y="282" width="16" height="28" rx="2" fill="#1a5276"/>
      <rect x="19" y="283" width="16" height="27" rx="2" fill="#2e86c1"/>
      <rect x="38" y="283" width="16" height="27" rx="2" fill="#85c1e9" stroke="#5dade2" stroke-width="0.5"/>
      <text x="27" y="328" class="team">+8 more</text>
      <text x="27" y="340" class="pct">&lt;3%</text>
    </g>
  </g>

  <!-- Annotation -->
  <text x="450" y="442" class="subtitle">All three methods compute the same function of the incidence matrix C and rate vector r</text>
</svg>
