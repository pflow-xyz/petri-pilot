openapi: "3.0.3"
info:
  title: "galton-board API"
  version: "1.0.0"
  description: "Generated API for galton-board workflow"

servers:
  - url: http://localhost:8080
    description: Development server

paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      tags:
        - system
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"

  /api/galtonboard:
    post:
      summary: Create new galton-board
      operationId: createGaltonBoard
      tags:
        - galtonboard
      responses:
        "201":
          description: Created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/galtonboard/{id}:
    get:
      summary: Get galton-board state
      operationId: getGaltonBoard
      tags:
        - galtonboard
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Aggregate ID
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /api/p00L:
    post:
      summary: "Peg 0,0 bounce left"
      operationId: p00l
      tags:
        - transitions
      x-transition-id: p00L
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/P00lRequest"
      responses:
        "200":
          description: Transition fired successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Transition failed (guard rejected or invalid state)
          content:
            application/json:
              schema:
