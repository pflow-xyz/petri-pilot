  /api/reject_offer:
    post:
      summary: "Candidate declines the offer"
      operationId: rejectOffer
      tags:
        - transitions
      x-transition-id: reject_offer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectOfferRequest"
      responses:
        "200":
          description: Transition fired successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionResult"
        "400":
          description: Invalid request
          content:
