  /api/extend_offer:
    post:
      summary: "Manager extends job offer"
      operationId: extendOffer
      tags:
        - transitions
      x-transition-id: extend_offer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtendOfferRequest"
      responses:
        "200":
          description: Transition fired successfully
          content:
