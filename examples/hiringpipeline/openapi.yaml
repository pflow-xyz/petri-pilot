openapi: "3.0.3"
info:
  title: "hiring-pipeline API"
  version: "1.0.0"
  description: "Generated API for hiring-pipeline workflow"

servers:
  - url: http://localhost:8080
    description: Development server

paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      tags:
        - system
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"

  /api/hiringpipeline:
    post:
      summary: Create new hiring-pipeline
      operationId: createHiringPipeline
      tags:
        - hiringpipeline
      responses:
        "201":
          description: Created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/hiringpipeline/{id}:
    get:
      summary: Get hiring-pipeline state
      operationId: getHiringPipeline
      tags:
        - hiringpipeline
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Aggregate ID
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /api/screen_candidate:
    post:
      summary: "Recruiter conducts phone screen"
      operationId: screenCandidate
      tags:
        - transitions
      x-transition-id: screen_candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreenCandidateRequest"
      responses:
        "200":
          description: Transition fired successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Transition failed (guard rejected or invalid state)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /api/pass_screen:
    post:
      summary: "Candidate passes phone screen - begin parallel interviews"
      operationId: passScreen
      tags:
        - transitions
      x-transition-id: pass_screen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PassScreenRequest"
      responses:
        "200":
          description: Transition fired successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Transition failed (guard rejected or invalid state)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /api/fail_screen:
    post:
      summary: "Candidate fails phone screen"
      operationId: failScreen
      tags:
        - transitions
      x-transition-id: fail_screen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FailScreenRequest"
      responses:
        "200":
          description: Transition fired successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Transition failed (guard rejected or invalid state)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /api/pass_technical:
    post:
      summary: "Candidate passes technical interview"
      operationId: passTechnical
      tags:
        - transitions
      x-transition-id: pass_technical
      requestBody:
        required: true
        content:
          application/json:
