openapi: "3.0.3"
info:
  title: "vet-clinic API"
  version: "1.0.0"
  description: "Generated API for vet-clinic workflow"

servers:
  - url: http://localhost:8080
    description: Development server

paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      tags:
        - system
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"

  /api/vetclinic:
    post:
      summary: Create new vet-clinic
      operationId: createVetClinic
      tags:
        - vetclinic
      responses:
        "201":
          description: Created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/vetclinic/{id}:
    get:
      summary: Get vet-clinic state
      operationId: getVetClinic
      tags:
        - vetclinic
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Aggregate ID
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /api/patient_arrives:
    post:
      summary: "Scheduled/walk-in patient arrives"
      operationId: patientArrives
      tags:
        - transitions
      x-transition-id: patient_arrives
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientArrivesRequest"
      responses:
        "200":
          description: Transition fired successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Transition failed (guard rejected or invalid state)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /api/emergency_arrives:
    post:
      summary: "Emergency walk-in (rate 0 via simulation.solver.rates — a transition-level 0 would read as unset and default to 1)"
