components:
  schemas:
    TransitionRequest:
      type: object
      required:
        - aggregate_id
      properties:
        aggregate_id:
          type: string
          description: ID of the aggregate to modify
        data:
          type: object
          description: Additional transition data
          additionalProperties: true

    TransitionResult:
      type: object
      properties:
        success:
          type: boolean
        aggregate_id:
          type: string
        version:
          type: integer
        state:
          type: object
          additionalProperties: true
        error:
          type: string

    StateResponse:
      type: object
      properties:
        aggregate_id:
          type: string
        version:
          type: integer
        state:
          $ref: "#/components/schemas/DiningPhilosophersState"
        places:
          type: object
          additionalProperties:
            type: integer
          description: Current Petri net marking
        enabled_transitions:
          type: array
          items:
            type: string
          description: Transitions that can currently fire

    DiningPhilosophersState:
      type: object
      description: Aggregate state for dining-philosophers
      properties:
        thinking_0:
          type: integer
        thinking_1:
          type: integer
        thinking_2:
          type: integer
        thinking_3:
          type: integer
        thinking_4:
          type: integer
        fork_0:
          type: integer
        fork_1:
          type: integer
        fork_2:
          type: integer
        fork_3:
          type: integer
        fork_4:
          type: integer
        has_left_0:
          type: integer
        has_left_1:
          type: integer
        has_left_2:
          type: integer
        has_left_3:
          type: integer
        has_left_4:
          type: integer
        eating_0:
          type: integer
        eating_1:
          type: integer
        eating_2:
          type: integer
        eating_3:
          type: integer
        eating_4:
          type: integer

    PickupLeft0Request:
      type: object
      required:
        - aggregate_id
      properties:
