openapi: "3.0.3"
info:
  title: "dining-philosophers API"
  version: "1.0.0"
  description: "Generated API for dining-philosophers workflow"

servers:
  - url: http://localhost:8080
    description: Development server

paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      tags:
        - system
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"

  /api/diningphilosophers:
    post:
      summary: Create new dining-philosophers
      operationId: createDiningPhilosophers
      tags:
        - diningphilosophers
      responses:
        "201":
          description: Created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/diningphilosophers/{id}:
    get:
      summary: Get dining-philosophers state
      operationId: getDiningPhilosophers
      tags:
        - diningphilosophers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Aggregate ID
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /api/pickup_left_0:
    post:
      summary: "Philosopher 0 picks up left fork (fork 4)"
      operationId: pickupLeft0
      tags:
        - transitions
      x-transition-id: pickup_left_0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickupLeft0Request"
      responses:
        "200":
          description: Transition fired successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Transition failed (guard rejected or invalid state)
          content:
            application/json:
              schema:
