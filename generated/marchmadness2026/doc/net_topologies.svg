<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#c33"/>
    </marker>
    <marker id="arrow-grn" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#2a7"/>
    </marker>
  </defs>

  <style>
    .title { font-size: 15px; font-weight: 700; fill: #222; }
    .subtitle { font-size: 11px; fill: #666; }
    .place { fill: #f0f4ff; stroke: #4466aa; stroke-width: 1.5; }
    .place-term { fill: #e8ffe8; stroke: #2a7744; stroke-width: 1.5; }
    .place-sink { fill: #ffe8e8; stroke: #cc3333; stroke-width: 1.5; }
    .trans { fill: #333; }
    .label { font-size: 10px; fill: #333; text-anchor: middle; }
    .label-sm { font-size: 9px; fill: #777; text-anchor: middle; }
    .verdict { font-size: 13px; font-weight: 700; text-anchor: middle; }
    .agree { fill: #2a7744; }
    .disagree { fill: #cc3333; }
    .badge { rx: 4; ry: 4; }
  </style>

  <!-- Model 4: Independent Chains -->
  <g transform="translate(20,10)">
    <text x="140" y="22" class="title" text-anchor="middle">Model 4: Independent Chains</text>
    <text x="140" y="38" class="subtitle" text-anchor="middle">100 tokens per team · no shared places</text>

    <!-- Team A chain -->
    <g transform="translate(0,60)">
      <text x="10" y="15" class="label-sm" text-anchor="start" fill="#555">Team A</text>
      <circle cx="60" cy="30" r="18" class="place"/>
      <text x="60" y="34" class="label">r64</text>
      <text x="60" y="52" class="label-sm">100</text>

      <rect x="108" y="22" width="4" height="16" class="trans"/>
      <line x1="78" y1="30" x2="108" y2="30" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

      <circle cx="155" cy="30" r="18" class="place-term"/>
      <text x="155" y="34" class="label">r32</text>
      <line x1="112" y1="30" x2="137" y2="30" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="108" y="62" width="4" height="16" class="trans"/>
      <line x1="74" y1="44" x2="108" y2="70" stroke="#c33" stroke-width="1" marker-end="url(#arrow-red)"/>
      <circle cx="155" cy="70" r="14" class="place-sink"/>
      <text x="155" y="74" class="label" style="font-size:8px">upset</text>
      <line x1="112" y1="70" x2="141" y2="70" stroke="#c33" stroke-width="1" marker-end="url(#arrow-red)"/>

      <!-- continuation dots -->
      <text x="190" y="34" class="label-sm">→ ···</text>
    </g>

    <!-- Team B chain (separate) -->
    <g transform="translate(0,160)">
      <text x="10" y="15" class="label-sm" text-anchor="start" fill="#555">Team B</text>
      <circle cx="60" cy="30" r="18" class="place"/>
      <text x="60" y="34" class="label">r64</text>
      <text x="60" y="52" class="label-sm">100</text>

      <rect x="108" y="22" width="4" height="16" class="trans"/>
      <line x1="78" y1="30" x2="108" y2="30" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
      <circle cx="155" cy="30" r="18" class="place-term"/>
      <text x="155" y="34" class="label">r32</text>
      <line x1="112" y1="30" x2="137" y2="30" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="108" y="62" width="4" height="16" class="trans"/>
      <line x1="74" y1="44" x2="108" y2="70" stroke="#c33" stroke-width="1" marker-end="url(#arrow-red)"/>
      <circle cx="155" cy="70" r="14" class="place-sink"/>
      <text x="155" y="74" class="label" style="font-size:8px">upset</text>
      <line x1="112" y1="70" x2="141" y2="70" stroke="#c33" stroke-width="1" marker-end="url(#arrow-red)"/>
      <text x="190" y="34" class="label-sm">→ ···</text>
    </g>

    <!-- No connection line -->
    <line x1="60" y1="130" x2="60" y2="170" stroke="#ccc" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="80" y="155" class="label-sm" fill="#999">no link</text>

    <rect x="40" y="310" width="200" height="32" rx="6" fill="#e8ffe8" stroke="#2a7744" stroke-width="1.5"/>
    <text x="140" y="331" class="verdict agree">AGREE — linear kinetics</text>
  </g>

  <!-- Model 2: Coupled Competition -->
  <g transform="translate(330,10)">
    <text x="140" y="22" class="title" text-anchor="middle">Model 2: Coupled Competition</text>
    <text x="140" y="38" class="subtitle" text-anchor="middle">~90 tokens per team · shared catalytic arcs</text>

    <g transform="translate(0,65)">
      <!-- Team A place -->
      <circle cx="60" cy="50" r="22" class="place"/>
      <text x="60" y="46" class="label">Team A</text>
      <text x="60" y="58" class="label-sm">~90</text>

      <!-- Team B place -->
      <circle cx="220" cy="50" r="22" class="place"/>
      <text x="220" y="46" class="label">Team B</text>
      <text x="220" y="58" class="label-sm">~90</text>

      <!-- Clash transition (A beats B) -->
      <rect x="133" y="10" width="14" height="14" class="trans" rx="1"/>
      <text x="140" y="8" class="label-sm">A wins</text>
      <!-- A → clash (catalyst) -->
      <line x1="80" y1="38" x2="133" y2="17" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- B → clash (consumed) -->
      <line x1="200" y1="38" x2="147" y2="17" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- clash → A (+2) -->
      <line x1="140" y1="24" x2="82" y2="42" stroke="#2a7" stroke-width="1.5" marker-end="url(#arrow-grn)"/>
      <text x="100" y="27" class="label-sm" fill="#2a7">+2</text>

      <!-- Clash transition (B beats A) -->
      <rect x="133" y="80" width="14" height="14" class="trans" rx="1"/>
      <text x="140" y="108" class="label-sm">B wins</text>
      <!-- A → clash -->
      <line x1="80" y1="62" x2="133" y2="87" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- B → clash -->
      <line x1="200" y1="62" x2="147" y2="87" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- clash → B (+2) -->
      <line x1="140" y1="80" x2="198" y2="58" stroke="#2a7" stroke-width="1.5" marker-end="url(#arrow-grn)"/>
      <text x="178" y="77" class="label-sm" fill="#2a7">+2</text>

      <!-- Coupling highlight -->
      <rect x="35" y="-5" width="210" height="130" rx="8" fill="none" stroke="#cc3333" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.5"/>
      <text x="140" y="140" class="label-sm" fill="#c33">mass-action: rate × A × B</text>

      <!-- Feedback annotation -->
      <text x="140" y="160" class="label-sm" fill="#c33">rich-get-richer feedback</text>
    </g>

    <rect x="40" y="310" width="200" height="32" rx="6" fill="#ffe8e8" stroke="#cc3333" stroke-width="1.5"/>
    <text x="140" y="331" class="verdict disagree">DISAGREE — 15/16 flip</text>
  </g>

  <!-- Model 6: Bracket Net -->
  <g transform="translate(660,10)">
    <text x="140" y="22" class="title" text-anchor="middle">Model 6: Bracket Net</text>
    <text x="140" y="38" class="subtitle" text-anchor="middle">1 token per team · coupled but binary</text>

    <g transform="translate(0,55)">
      <!-- R1 places -->
      <circle cx="40" cy="30" r="16" class="place"/>
      <text x="40" y="26" class="label" style="font-size:8px">Duke</text>
      <text x="40" y="36" class="label-sm">r1: 1</text>

      <circle cx="40" cy="90" r="16" class="place"/>
      <text x="40" y="86" class="label" style="font-size:8px">Kansas</text>
      <text x="40" y="96" class="label-sm">r1: 1</text>

      <!-- Matchup transitions -->
      <rect x="98" y="40" width="10" height="12" class="trans" rx="1"/>
      <text x="103" y="36" class="label-sm" style="font-size:7px">Duke w.</text>
      <line x1="56" y1="30" x2="98" y2="46" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="56" y1="90" x2="98" y2="52" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>

      <rect x="98" y="72" width="10" height="12" class="trans" rx="1"/>
      <text x="103" y="98" class="label-sm" style="font-size:7px">Kan. w.</text>
      <line x1="56" y1="35" x2="98" y2="78" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="56" y1="85" x2="98" y2="78" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- R2 places -->
      <circle cx="160" cy="40" r="14" class="place-term"/>
      <text x="160" y="36" class="label" style="font-size:7px">Duke</text>
      <text x="160" y="46" class="label-sm" style="font-size:7px">r2</text>
      <line x1="108" y1="46" x2="146" y2="40" stroke="#2a7" stroke-width="1" marker-end="url(#arrow-grn)"/>

      <circle cx="160" cy="82" r="14" class="place-term"/>
      <text x="160" y="78" class="label" style="font-size:7px">Kansas</text>
      <text x="160" y="88" class="label-sm" style="font-size:7px">r2</text>
      <line x1="108" y1="78" x2="146" y2="82" stroke="#2a7" stroke-width="1" marker-end="url(#arrow-grn)"/>

      <!-- Out places -->
      <circle cx="160" cy="120" r="10" class="place-sink"/>
      <text x="160" y="123" class="label" style="font-size:7px">out</text>
      <line x1="108" y1="52" x2="152" y2="112" stroke="#c33" stroke-width="0.8" marker-end="url(#arrow-red)"/>
      <line x1="108" y1="84" x2="152" y2="112" stroke="#c33" stroke-width="0.8" marker-end="url(#arrow-red)"/>

      <!-- Continuation -->
      <text x="195" y="62" class="label-sm">→ F4 →</text>
      <text x="195" y="74" class="label-sm">Champ</text>

      <!-- Binary annotation -->
      <text x="140" y="155" class="label-sm" fill="#4466aa">tokens ∈ {0, 1}</text>
      <text x="140" y="170" class="label-sm" fill="#4466aa">rate × 1 × 1 = rate</text>
      <text x="140" y="185" class="label-sm" fill="#4466aa">nonlinearity is inert</text>
    </g>

    <rect x="40" y="310" width="200" height="32" rx="6" fill="#e8ffe8" stroke="#2a7744" stroke-width="1.5"/>
    <text x="140" y="331" class="verdict agree">AGREE — binary tokens</text>
  </g>

  <!-- Divider lines -->
  <line x1="310" y1="50" x2="310" y2="370" stroke="#ddd" stroke-width="1"/>
  <line x1="640" y1="50" x2="640" y2="370" stroke="#ddd" stroke-width="1"/>

  <!-- Bottom legend -->
  <rect x="0" y="390" width="960" height="30" fill="#f8f8f8" rx="4"/>
  <circle cx="280" cy="405" r="8" class="place"/>
  <text x="295" y="409" class="label-sm" text-anchor="start">intermediate place</text>
  <circle cx="420" cy="405" r="8" class="place-term"/>
  <text x="435" y="409" class="label-sm" text-anchor="start">advancement</text>
  <circle cx="540" cy="405" r="8" class="place-sink"/>
  <text x="555" y="409" class="label-sm" text-anchor="start">elimination</text>
  <rect x="638" y="399" width="8" height="12" class="trans" rx="1"/>
  <text x="655" y="409" class="label-sm" text-anchor="start">transition (matchup)</text>
</svg>
