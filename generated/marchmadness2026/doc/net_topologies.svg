<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#c33"/>
    </marker>
    <marker id="arrow-grn" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#2a7"/>
    </marker>
  </defs>

  <style>
    .title { font-size: 15px; font-weight: 700; fill: #222; }
    .subtitle { font-size: 11px; fill: #666; }
    .place { fill: #f0f4ff; stroke: #4466aa; stroke-width: 1.5; }
    .place-term { fill: #e8ffe8; stroke: #2a7744; stroke-width: 1.5; }
    .place-sink { fill: #ffe8e8; stroke: #cc3333; stroke-width: 1.5; }
    .trans { fill: #333; }
    .label { font-size: 10px; fill: #333; text-anchor: middle; }
    .label-sm { font-size: 9px; fill: #777; text-anchor: middle; }
    .verdict { font-size: 13px; font-weight: 700; text-anchor: middle; }
    .agree { fill: #2a7744; }
    .disagree { fill: #cc3333; }
  </style>

  <!-- Model 4: Independent Chains -->
  <g transform="translate(20,10)">
    <text x="140" y="22" class="title" text-anchor="middle">Model 4: Independent Chains</text>
    <text x="140" y="38" class="subtitle" text-anchor="middle">100 tokens per team, no shared places</text>

    <!-- Team A chain -->
    <g transform="translate(0,55)">
      <text x="10" y="15" class="label-sm" text-anchor="start" fill="#555">Team A</text>
      <circle cx="60" cy="32" r="18" class="place"/>
      <text x="60" y="36" class="label">r64</text>
      <text x="60" y="54" class="label-sm">100</text>

      <rect x="108" y="24" width="5" height="16" class="trans"/>
      <line x1="78" y1="32" x2="108" y2="32" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

      <circle cx="158" cy="32" r="18" class="place-term"/>
      <text x="158" y="36" class="label">r32</text>
      <line x1="113" y1="32" x2="140" y2="32" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="108" y="66" width="5" height="16" class="trans"/>
      <line x1="74" y1="46" x2="108" y2="74" stroke="#c33" stroke-width="1" marker-end="url(#arrow-red)"/>
      <circle cx="158" cy="74" r="14" class="place-sink"/>
      <text x="158" y="78" class="label" style="font-size:9px">out</text>
      <line x1="113" y1="74" x2="144" y2="74" stroke="#c33" stroke-width="1" marker-end="url(#arrow-red)"/>
      <text x="195" y="36" class="label-sm">...</text>
    </g>

    <!-- Team B chain -->
    <g transform="translate(0,160)">
      <text x="10" y="15" class="label-sm" text-anchor="start" fill="#555">Team B</text>
      <circle cx="60" cy="32" r="18" class="place"/>
      <text x="60" y="36" class="label">r64</text>
      <text x="60" y="54" class="label-sm">100</text>

      <rect x="108" y="24" width="5" height="16" class="trans"/>
      <line x1="78" y1="32" x2="108" y2="32" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
      <circle cx="158" cy="32" r="18" class="place-term"/>
      <text x="158" y="36" class="label">r32</text>
      <line x1="113" y1="32" x2="140" y2="32" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="108" y="66" width="5" height="16" class="trans"/>
      <line x1="74" y1="46" x2="108" y2="74" stroke="#c33" stroke-width="1" marker-end="url(#arrow-red)"/>
      <circle cx="158" cy="74" r="14" class="place-sink"/>
      <text x="158" y="78" class="label" style="font-size:9px">out</text>
      <line x1="113" y1="74" x2="144" y2="74" stroke="#c33" stroke-width="1" marker-end="url(#arrow-red)"/>
      <text x="195" y="36" class="label-sm">...</text>
    </g>

    <line x1="60" y1="130" x2="60" y2="170" stroke="#ccc" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="82" y="155" class="label-sm" fill="#999">no link</text>

    <rect x="40" y="300" width="200" height="30" rx="6" fill="#e8ffe8" stroke="#2a7744" stroke-width="1.5"/>
    <text x="140" y="320" class="verdict agree">AGREE</text>
  </g>

  <!-- Model 2: Coupled Competition -->
  <g transform="translate(330,10)">
    <text x="140" y="22" class="title" text-anchor="middle">Model 2: Coupled Competition</text>
    <text x="140" y="38" class="subtitle" text-anchor="middle">~90 tokens per team, shared arcs</text>

    <g transform="translate(0,70)">
      <circle cx="60" cy="50" r="24" class="place"/>
      <text x="60" y="46" class="label">Team A</text>
      <text x="60" y="58" class="label-sm">~90</text>

      <circle cx="220" cy="50" r="24" class="place"/>
      <text x="220" y="46" class="label">Team B</text>
      <text x="220" y="58" class="label-sm">~90</text>

      <!-- A wins -->
      <rect x="133" y="10" width="14" height="14" class="trans" rx="1"/>
      <text x="140" y="6" class="label-sm">A wins</text>
      <line x1="82" y1="38" x2="133" y2="17" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="198" y1="38" x2="147" y2="17" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="140" y1="24" x2="84" y2="40" stroke="#2a7" stroke-width="1.5" marker-end="url(#arrow-grn)"/>
      <text x="100" y="26" class="label-sm" fill="#2a7">+2</text>

      <!-- B wins -->
      <rect x="133" y="82" width="14" height="14" class="trans" rx="1"/>
      <text x="140" y="110" class="label-sm">B wins</text>
      <line x1="82" y1="62" x2="133" y2="89" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="198" y1="62" x2="147" y2="89" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="140" y1="82" x2="196" y2="60" stroke="#2a7" stroke-width="1.5" marker-end="url(#arrow-grn)"/>
      <text x="178" y="78" class="label-sm" fill="#2a7">+2</text>

      <rect x="30" y="-5" width="220" height="130" rx="8" fill="none" stroke="#cc3333" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.5"/>
      <text x="140" y="140" class="label-sm" fill="#c33">rate x A x B</text>
      <text x="140" y="156" class="label-sm" fill="#c33">rich-get-richer</text>
    </g>

    <rect x="40" y="300" width="200" height="30" rx="6" fill="#ffe8e8" stroke="#cc3333" stroke-width="1.5"/>
    <text x="140" y="320" class="verdict disagree">DISAGREE (15/16)</text>
  </g>

  <!-- Model 6: Bracket Net -->
  <g transform="translate(660,10)">
    <text x="140" y="22" class="title" text-anchor="middle">Model 6: Bracket Net</text>
    <text x="140" y="38" class="subtitle" text-anchor="middle">1 token per team, coupled but binary</text>

    <g transform="translate(0,60)">
      <!-- R1 places -->
      <circle cx="45" cy="35" r="18" class="place"/>
      <text x="45" y="31" class="label" style="font-size:9px">Duke</text>
      <text x="45" y="42" class="label-sm">r1: 1</text>

      <circle cx="45" cy="105" r="18" class="place"/>
      <text x="45" y="101" class="label" style="font-size:9px">Kansas</text>
      <text x="45" y="112" class="label-sm">r1: 1</text>

      <!-- Matchup transitions -->
      <rect x="108" y="45" width="12" height="14" class="trans" rx="1"/>
      <text x="114" y="40" class="label-sm">Duke w.</text>
      <line x1="63" y1="35" x2="108" y2="52" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="63" y1="105" x2="108" y2="59" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>

      <rect x="108" y="82" width="12" height="14" class="trans" rx="1"/>
      <text x="114" y="110" class="label-sm">Kan. w.</text>
      <line x1="63" y1="40" x2="108" y2="89" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="63" y1="100" x2="108" y2="89" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- R2 places -->
      <circle cx="180" cy="48" r="16" class="place-term"/>
      <text x="180" y="44" class="label" style="font-size:9px">Duke</text>
      <text x="180" y="55" class="label-sm">r2</text>
      <line x1="120" y1="52" x2="164" y2="48" stroke="#2a7" stroke-width="1" marker-end="url(#arrow-grn)"/>

      <circle cx="180" cy="92" r="16" class="place-term"/>
      <text x="180" y="88" class="label" style="font-size:9px">Kansas</text>
      <text x="180" y="99" class="label-sm">r2</text>
      <line x1="120" y1="89" x2="164" y2="92" stroke="#2a7" stroke-width="1" marker-end="url(#arrow-grn)"/>

      <!-- Out places -->
      <circle cx="180" cy="140" r="12" class="place-sink"/>
      <text x="180" y="143" class="label" style="font-size:9px">out</text>
      <line x1="120" y1="59" x2="170" y2="130" stroke="#c33" stroke-width="0.8" marker-end="url(#arrow-red)"/>
      <line x1="120" y1="96" x2="170" y2="130" stroke="#c33" stroke-width="0.8" marker-end="url(#arrow-red)"/>

      <!-- Continuation -->
      <text x="220" y="72" class="label-sm">... F4, Champ</text>

      <!-- Binary annotation -->
      <text x="140" y="175" class="label-sm" fill="#4466aa">tokens in {0, 1}</text>
      <text x="140" y="190" class="label-sm" fill="#4466aa">rate x 1 x 1 = rate</text>
      <text x="140" y="205" class="label-sm" fill="#4466aa">nonlinearity is inert</text>
    </g>

    <rect x="40" y="300" width="200" height="30" rx="6" fill="#e8ffe8" stroke="#2a7744" stroke-width="1.5"/>
    <text x="140" y="320" class="verdict agree">AGREE</text>
  </g>

  <!-- Divider lines -->
  <line x1="310" y1="50" x2="310" y2="340" stroke="#ddd" stroke-width="1"/>
  <line x1="640" y1="50" x2="640" y2="340" stroke="#ddd" stroke-width="1"/>

  <!-- Bottom legend -->
  <rect x="0" y="360" width="960" height="30" fill="#f8f8f8" rx="4"/>
  <circle cx="200" cy="375" r="7" class="place"/>
  <text x="215" y="379" class="label-sm" text-anchor="start">intermediate</text>
  <circle cx="340" cy="375" r="7" class="place-term"/>
  <text x="355" y="379" class="label-sm" text-anchor="start">advancement</text>
  <circle cx="490" cy="375" r="7" class="place-sink"/>
  <text x="505" y="379" class="label-sm" text-anchor="start">elimination</text>
  <rect x="630" y="370" width="7" height="10" class="trans" rx="1"/>
  <text x="645" y="379" class="label-sm" text-anchor="start">transition</text>
</svg>
