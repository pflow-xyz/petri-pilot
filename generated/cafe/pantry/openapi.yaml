openapi: "3.0.3"
info:
  title: "pantry API"
  version: "1.0.0"
  description: "Generated API for pantry workflow"

servers:
  - url: http://localhost:8080
    description: Development server

paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      tags:
        - system
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"

  /api/pantry:
    post:
      summary: Create new pantry
      operationId: createPantry
      tags:
        - pantry
      responses:
        "201":
          description: Created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/pantry/{id}:
    get:
      summary: Get pantry state
      operationId: getPantry
      tags:
        - pantry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Aggregate ID
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /api/brew_espresso:
    post:
      summary: "Fire brew_espresso transition"
      operationId: brewEspresso
      tags:
        - transitions
      x-transition-id: brew_espresso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrewEspressoRequest"
      responses:
        "200":
          description: Transition fired successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Transition failed (guard rejected or invalid state)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /api/brew_latte:
    post:
      summary: "Fire brew_latte transition"
      operationId: brewLatte
      tags:
        - transitions
      x-transition-id: brew_latte
      requestBody:
