        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrewLatteRequest"
      responses:
        "200":
          description: Transition fired successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Transition failed (guard rejected or invalid state)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /api/brew_cappuccino:
    post:
      summary: "Fire brew_cappuccino transition"
      operationId: brewCappuccino
      tags:
        - transitions
      x-transition-id: brew_cappuccino
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrewCappuccinoRequest"
      responses:
        "200":
          description: Transition fired successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Transition failed (guard rejected or invalid state)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /api/restock_coffee_beans:
    post:
      summary: "Fire restock_coffee_beans transition"
      operationId: restockCoffeeBeans
      tags:
        - transitions
      x-transition-id: restock_coffee_beans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestockCoffeeBeansRequest"
      responses:
        "200":
          description: Transition fired successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Transition failed (guard rejected or invalid state)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /api/restock_milk:
    post:
      summary: "Fire restock_milk transition"
      operationId: restockMilk
      tags:
        - transitions
      x-transition-id: restock_milk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestockMilkRequest"
      responses:
        "200":
          description: Transition fired successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionResult"
