name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # go.mod carries a temporary `replace ../go-pflow` (see CLAUDE.md);
      # provide the sibling checkout it points at.
      - name: Check out go-pflow sibling (go.mod replace)
        uses: actions/checkout@v5
        with:
          # Pinned: without a ref this job compiles whatever is on go-pflow
          # main at the moment it runs, so an unrelated go-pflow push can turn
          # this repo's CI red. Bump deliberately, or drop with the replace.
          repository: pflow-xyz/go-pflow
          ref: 3975b7f6ced679439c53754c3e35b44c99357bde
          path: .go-pflow-sibling

      - name: Move sibling to ../go-pflow
        # A real directory outside the workspace, exactly like a local
        # checkout — a symlink into the workspace confuses Bazel's go_deps
        # materialization (and gazelle would otherwise walk it).
        run: rm -rf ../go-pflow && mv "$PWD/.go-pflow-sibling" ../go-pflow


      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
