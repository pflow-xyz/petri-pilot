name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Run go vet
        run: go vet ./...

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Configure git for private repos
        run: git config --global url."https://${{ github.token }}@github.com/".insteadOf "https://github.com/"

      - name: Install Go dependencies
        run: go mod download

      - name: Run Go tests
        run: go test ./...
        env:
          GOPRIVATE: github.com/pflow-xyz/petri-pilot

      # F4: the shipped binary uses gnark-crypto's asm field arithmetic, but
      # Bazel builds with -tags purego. This asserts the two backends produce
      # bit-identical field/circuit digests, so a divergence can never reach
      # the on-chain Groth16 verifiers undetected.
      - name: ZK field backend parity (purego vs asm)
        run: ./scripts/zk-parity-check.sh
        env:
          GOPRIVATE: github.com/pflow-xyz/petri-pilot

      # F4 Tier 3: assert each committed Solidity verifier still matches its
      # circuit's hermetic R1CS, so a circuit edit can't silently leave the
      # deployed verifier verifying the wrong relation. (The on-chain bytecode
      # leg needs forge+RPC — scripts/zk-onchain-bytecode-check.sh, run manually.)
      - name: ZK verifier provenance (circuit <-> verifier)
        run: go run ./cmd/zk-verifier-provenance
        env:
          GOPRIVATE: github.com/pflow-xyz/petri-pilot


  # The café what-if console is hand-written, so nothing generates a test for
  # it. This drives the real page: it builds the binary, serves the composed app
  # on a free port, checks it in headless Chromium, and tears down.
  #
  # It is not in `make test` — a fresh clone should not fail on a missing
  # browser — so this job is the only place it runs automatically. Its
  # predecessor was a DOM stub that needed no browser and, being unable to see
  # the page, passed while every API call 404'd and the page rendered empty.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Configure git for private repos
        run: git config --global url."https://${{ github.token }}@github.com/".insteadOf "https://github.com/"

      - name: Install browser tooling
        run: make e2e-install

      - name: Check the café console in a browser
        run: make test-browser
        env:
          GOPRIVATE: github.com/pflow-xyz/petri-pilot

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Build petri-pilot
        run: go build -o petri-pilot ./cmd/petri-pilot

      - name: Build example services
        run: go build ./examples/...

      # generated/ holds current generator output. Building it is what proves the
      # generators emit code that actually compiles — the in-memory hash checks
      # cannot.
      - name: Build generated services
        run: go build ./generated/...

  # Exercises the hermetic Bazel graph so BUILD.bazel / MODULE.bazel can't
  # silently drift from the Go sources, and so artifacts populate the shared
  # remote cache (bazel.stackdump.com) on push.
  bazel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      # Wire the shared bazel-remote cache. The .bazelrc default is read-only
      # (--noremote_upload_local_results), so only a trusted push writes it:
      #   - push (trusted)       -> opt into uploads (populates the cache)
      #   - pull_request         -> read-only default stands
      #   - no secret (fork PR)  -> skip remote entirely; plain local build
      # --remote_local_fallback in .bazelrc means a cache outage never fails CI.
      - name: Configure Bazel remote cache
        env:
          CACHE_USER: ${{ secrets.BAZEL_REMOTE_CACHE_USERNAME }}
          CACHE_PASSWORD: ${{ secrets.BAZEL_REMOTE_CACHE_PASSWORD }}
        run: |
          if [ -z "$CACHE_PASSWORD" ]; then
            echo "No remote-cache secret available — building without --config=remote."
            echo "BAZEL_REMOTE=" >> "$GITHUB_ENV"
            exit 0
          fi
          umask 077
          cat > "$HOME/.netrc" <<EOF
          machine bazel.stackdump.com
          login $CACHE_USER
          password $CACHE_PASSWORD
          EOF
          FLAGS="--config=remote"
          if [ "${{ github.event_name }}" = "push" ]; then
            FLAGS="$FLAGS --remote_upload_local_results"
            echo "push build: remote cache read + write."
          else
            echo "pull_request build: remote cache is read-only."
          fi
          echo "BAZEL_REMOTE=$FLAGS" >> "$GITHUB_ENV"

      - name: Check BUILD files are up to date (gazelle)
        run: bazel run //:gazelle -- -mode=diff

      - name: Build
        run: bazel build //... $BAZEL_REMOTE

      - name: Test
        run: bazel test //... --test_output=errors $BAZEL_REMOTE
